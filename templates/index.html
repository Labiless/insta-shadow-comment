<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment Finder</title>
  <style>
    :root {
      --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
      --border: #deded8; --accent: #3b5bdb; --ok: #1f7a4d; --ok-bg: #e7f5ec;
      --no: #9a3412; --no-bg: #fdeee6; --err: #b42318; --err-bg: #fdecea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --card: #1f1f1d; --text: #ececea; --muted: #a0a09a;
        --border: #34342f; --accent: #7d96ff; --ok: #6fd6a0; --ok-bg: #16301f;
        --no: #f4a77a; --no-bg: #35200f; --err: #ff8a80; --err-bg: #3a1614;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type=text] {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 16px;
    }
    input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .checks { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .checks label { font-weight: 400; display: flex; gap: 8px; align-items: center; margin: 0; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .status { border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; font-weight: 600; }
    .status.ok { background: var(--ok-bg); color: var(--ok); }
    .status.no { background: var(--no-bg); color: var(--no); }
    .status.err { background: var(--err-bg); color: var(--err); }
    .meta { color: var(--muted); font-size: .9rem; }
    .comment p { margin: 8px 0; white-space: pre-wrap; word-wrap: break-word; }
    .comment a { color: var(--accent); }
    .hidden-badge { color: var(--no); font-weight: 600; }
    .status.wait { background: var(--card); color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
    .post-card h2 { font-size: 1rem; margin: 0 0 2px; }
    .post-card h2 a { color: var(--text); text-decoration: none; }
    .post-card h2 a:hover { text-decoration: underline; }
    .caption {
      margin: 12px 0 0; white-space: pre-wrap; word-wrap: break-word;
      max-height: 12em; overflow: auto;
    }
    .caption.empty { color: var(--muted); font-style: italic; }
    .section-label {
      font-size: .75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin: 0 0 8px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Comment Finder</h1>
  <p class="sub">Check whether an account has commented on an Instagram post.</p>

  <form class="card" id="search-form">
    <label for="post">Post link</label>
    <input type="text" id="post" name="post" placeholder="https://www.instagram.com/p/..." required>

    <label for="target">Account to look for</label>
    <input type="text" id="target" name="target" placeholder="username" required>

    <div class="checks">
      <label><input type="checkbox" id="replies" checked> Include replies</label>
      <label><input type="checkbox" id="all"> Find all of the account's comments</label>
    </div>

    <button type="submit" id="submit">Search</button>
  </form>

  <div id="error" class="status err" hidden></div>

  <section id="post-section" hidden>
    <p class="section-label">Post being searched</p>
    <div class="card post-card">
      <h2><a id="post-link" target="_blank" rel="noopener"></a></h2>
      <div class="meta" id="post-meta"></div>
      <p class="caption" id="post-caption"></p>
    </div>
  </section>

  <div id="waiting" class="status wait" hidden>Searching comments… (this may take a few minutes)</div>

  <section id="result-section" hidden>
    <div id="result-status" class="status"></div>
    <p class="meta" id="result-meta"></p>
    <div id="matches"></div>
  </section>
</main>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var plural = function (n, word) { return n + " " + word + (n === 1 ? "" : "s"); };

  async function callApi(path, body) {
    var resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    var data = await resp.json().catch(function () { return { error: "Unexpected server response." }; });
    if (!resp.ok || data.error) throw new Error(data.error || "Request failed.");
    return data;
  }

  function showPost(info) {
    $("post-link").textContent = info.type + " by @" + info.owner;
    $("post-link").href = info.url;
    $("post-meta").textContent = info.date + " · " + plural(info.likes, "like") + " · " +
      plural(info.declared_comments, "comment") + " declared";
    var caption = info.caption.trim();
    $("post-caption").textContent = caption || "(no caption)";
    $("post-caption").classList.toggle("empty", !caption);
    $("post-section").hidden = false;
  }

  function showResult(result) {
    var n = result.matches.length;
    var status = $("result-status");
    status.className = "status " + (n ? "ok" : "no");
    status.textContent = n ? "Found " + plural(n, "comment") + " by @" + result.target
                           : "No comments by @" + result.target;
    $("result-meta").textContent = plural(result.scanned, "comment") + " scanned out of " +
      result.declared_comments + " declared";

    var list = $("matches");
    list.replaceChildren();
    result.matches.forEach(function (m) {
      var card = document.createElement("div");
      card.className = "card comment";

      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (m.reply_to ? "Reply to @" + m.reply_to : "Comment") + " · " + m.date +
        " · " + plural(m.likes, "like");
      if (m.hidden) {
        var badge = document.createElement("span");
        badge.className = "hidden-badge";
        badge.textContent = "hidden by Instagram";
        meta.append(" · ", badge);
      }

      var text = document.createElement("p");
      text.textContent = m.text;

      var link = document.createElement("a");
      link.href = m.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Open on Instagram";

      card.append(meta, text, link);
      list.append(card);
    });
    $("result-section").hidden = false;
  }

  $("search-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var body = {
      post: $("post").value.trim(),
      target: $("target").value.trim(),
      replies: $("replies").checked,
      all: $("all").checked,
    };
    var button = $("submit");
    button.disabled = true;
    ["error", "post-section", "waiting", "result-section"].forEach(function (id) { $(id).hidden = true; });

    try {
      button.textContent = "Loading post…";
      showPost(await callApi("/api/post", { post: body.post }));

      button.textContent = "Searching…";
      $("waiting").hidden = false;
      showResult(await callApi("/api/search", body));
    } catch (err) {
      $("error").textContent = err.message;
      $("error").hidden = false;
    } finally {
      $("waiting").hidden = true;
      button.disabled = false;
      button.textContent = "Search";
    }
  });
</script>
</body>
</html>
