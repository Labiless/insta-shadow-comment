; Copia questo file in config.ini e inserisci i tuoi dati.
; config.ini non va mai condiviso.

[instagram]
; Il tuo username Instagram (obbligatorio).
username = tuo_username

; --- Metodo 1 (consigliato): cookie del browser ---
; Evita il blocco "Checkpoint required" che Instagram applica ai login da script.
; 1. Accedi a https://www.instagram.com con Chrome/Safari/Firefox.
; 2. Apri gli strumenti sviluppatore (Cmd+Option+I).
;    Chrome:  scheda Application > Cookies > https://www.instagram.com
;    Safari:  scheda Storage > Cookies  (prima abilita il menu Sviluppo nelle impostazioni)
;    Firefox: scheda Archiviazione > Cookie
; 3. Copia qui il valore dei cookie "sessionid" e "csrftoken".
; Non fare logout da quel browser, altrimenti la sessione viene invalidata.
sessionid =
csrftoken =

; --- Metodo 2: password ---
; Usata solo se sessionid è vuoto. Instagram può bloccarla con un "checkpoint".
password =
