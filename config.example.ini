; Copy this file to config.ini and fill in your details.
; Never share config.ini.

[instagram]
; Your Instagram username (required).
username = your_username

; --- Method 1 (recommended): browser cookies ---
; Avoids the "Checkpoint required" block Instagram applies to scripted logins.
; 1. Log in to https://www.instagram.com with Chrome/Safari/Firefox.
; 2. Open the developer tools (Cmd+Option+I).
;    Chrome:  Application tab > Cookies > https://www.instagram.com
;    Safari:  Storage tab > Cookies  (first enable the Develop menu in Settings)
;    Firefox: Storage tab > Cookies
; 3. Copy the values of the "sessionid" and "csrftoken" cookies here.
; Do not log out from that browser, or the session will be invalidated.
sessionid =
csrftoken =

; --- Method 2: password ---
; Used only if sessionid is empty. Instagram may block it with a "checkpoint".
password =
